<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devonbegi Kundaligi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07131f; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, DUR = 10;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, e) => clamp((t - s) / (e - s));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const GOLD = '#e3b766', GOLD_L = '#fbe3a6', GOLD_D = '#9c6f2c';
const PAPER = '#efe0bd', PAPER_D = '#d6bf8e', INK = '#3a2614';

// particles
const R = rng(7);
const dust = Array.from({ length: 140 }, () => ({
  x: R() * W, y: R() * H, r: 0.6 + R() * 2.4, sp: 8 + R() * 30, ph: R() * 6.28, a: 0.2 + R() * 0.6
}));
const sparks = Array.from({ length: 70 }, () => ({
  ang: R() * Math.PI * 2, d: 60 + R() * 420, sp: 0.4 + R() * 1.2, r: 1 + R() * 2.5, delay: R() * 0.6
}));

// handwriting lines on pages
const R2 = rng(42);
const pageLines = Array.from({ length: 9 }, (_, i) => ({ y: i, len: 0.55 + R2() * 0.4, seed: R2() * 100 }));

// ---------- drawing pieces ----------
function background(t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.48, 50, W / 2, H / 2, W * 0.75);
  g.addColorStop(0, '#173049');
  g.addColorStop(0.45, '#0c1d2e');
  g.addColorStop(1, '#03080e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // faint tiled star pattern
  const a = 0.05 * easeOut(prog(t, 0, 1.5));
  if (a > 0) {
    ctx.save();
    ctx.globalAlpha = a; ctx.strokeStyle = GOLD; ctx.lineWidth = 1;
    const s = 160, off = (t * 6) % s;
    for (let y = -s; y < H + s; y += s) for (let x = -s; x < W + s; x += s) {
      star8(x + off, y + s / 2, s * 0.38, 0); ctx.stroke();
    }
    ctx.restore();
  }
}

function star8(cx, cy, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const ang = rot + i * Math.PI / 8;
    const rr = i % 2 === 0 ? r : r * 0.62;
    const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function strokeProgress(pathFn, p, len) {
  ctx.setLineDash([len * p, len]);
  pathFn(); ctx.stroke();
  ctx.setLineDash([]);
}

// central mandala (girih rosette)
function mandala(t, cx, cy, scale, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  const rot = t * 0.12;
  ctx.shadowColor = 'rgba(240,190,100,.55)'; ctx.shadowBlur = 18;

  // outer circles
  const p1 = easeInOut(prog(t, 0.2, 1.8));
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
  strokeProgress(() => { ctx.beginPath(); ctx.arc(0, 0, 330, -Math.PI / 2, Math.PI * 1.5); }, p1, 2 * Math.PI * 330);
  ctx.lineWidth = 1.2;
  strokeProgress(() => { ctx.beginPath(); ctx.arc(0, 0, 350, Math.PI / 2, Math.PI * 2.5); }, p1, 2 * Math.PI * 350);

  // two rotated squares -> 8 point star
  const p2 = easeInOut(prog(t, 0.5, 2.1));
  ctx.lineWidth = 3; ctx.strokeStyle = GOLD_L;
  for (let k = 0; k < 2; k++) {
    strokeProgress(() => {
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const ang = rot + k * Math.PI / 4 + i * Math.PI / 2;
        const x = Math.cos(ang) * 300, y = Math.sin(ang) * 300;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
    }, p2, 4 * 300 * Math.SQRT2);
  }

  // inner star
  const p3 = easeInOut(prog(t, 0.9, 2.4));
  ctx.lineWidth = 2; ctx.strokeStyle = GOLD;
  strokeProgress(() => star8(0, 0, 200, -rot * 1.5), p3, 16 * 100);

  // petals ring
  const p4 = easeOut(prog(t, 1.3, 2.6));
  for (let i = 0; i < 16; i++) {
    const pi = clamp(p4 * 16 - i * 0.5);
    if (pi <= 0) continue;
    const ang = -rot * 0.6 + i * Math.PI / 8;
    ctx.save(); ctx.rotate(ang);
    ctx.globalAlpha = alpha * pi;
    ctx.beginPath();
    ctx.ellipse(250, 0, 22 * pi, 8 * pi, 0, 0, Math.PI * 2);
    ctx.fillStyle = GOLD_D; ctx.fill();
    ctx.strokeStyle = GOLD_L; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // dots on the outer ring
  for (let i = 0; i < 32; i++) {
    const pi = clamp(p1 * 32 - i);
    if (pi <= 0) continue;
    const ang = i * Math.PI / 16 - Math.PI / 2;
    ctx.globalAlpha = alpha * pi;
    ctx.beginPath(); ctx.arc(Math.cos(ang) * 340, Math.sin(ang) * 340, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = GOLD_L; ctx.fill();
  }
  ctx.restore();
}

// the diary (book) that rises and opens
function book(t) {
  const rise = easeOut(prog(t, 2.0, 3.0));
  if (rise <= 0) return;
  const open = easeInOut(prog(t, 2.9, 4.6));
  const cy = lerp(H + 300, H * 0.70, rise);
  const pw = 360, ph = 230;
  ctx.save();
  ctx.translate(W / 2, cy + Math.sin(t * 1.6) * 4 * prog(t, 4.6, 5.5));

  const gg = ctx.createRadialGradient(0, 40, 10, 0, 40, 520);
  gg.addColorStop(0, `rgba(250,200,110,${0.35 * open})`);
  gg.addColorStop(1, 'rgba(250,200,110,0)');
  ctx.fillStyle = gg; ctx.fillRect(-600, -400, 1200, 800);

  const off = lerp(-pw / 2, 0, open);          // spine x
  const fx = Math.cos(open * Math.PI);          // cover direction 1 -> -1
  const cw = pw * fx;

  // back cover + right page
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#5a2418'; roundRect(off - 4, -ph / 2 - 10, pw + 14, ph + 20, 8);
  ctx.shadowColor = 'transparent';
  drawPage(off, -ph / 2, pw, ph, 'right', t, open);

  if (fx >= 0) {
    // front cover, outside visible
    ctx.fillStyle = '#7a2f1e'; roundRect(off - 4, -ph / 2 - 10, cw + 14 * fx, ph + 20, 8);
    if (fx > 0.05) {
      ctx.save(); ctx.translate(off + cw / 2, 0); ctx.scale(fx, 1);
      ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
      ctx.strokeRect(-pw / 2 + 20, -ph / 2 + 12, pw - 40, ph - 24);
      star8(0, 0, 60, 0); ctx.stroke();
      star8(0, 0, 30, Math.PI / 8); ctx.fillStyle = GOLD_D; ctx.fill();
      ctx.restore();
    }
  } else {
    // cover flipped: inside = left page
    const lw = -cw;
    ctx.fillStyle = '#5a2418'; roundRect(off - lw - 10, -ph / 2 - 10, lw + 14, ph + 20, 8);
    drawPage(off - lw, -ph / 2, lw, ph, 'left', t, open);
  }
  // spine
  ctx.fillStyle = 'rgba(60,30,10,.35)'; ctx.fillRect(off - 2, -ph / 2, 4, ph);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}

function drawPage(x, y, w, h, side, t, open) {
  if (w <= 1) return;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  if (side === 'left') { g.addColorStop(0, PAPER); g.addColorStop(0.85, PAPER); g.addColorStop(1, PAPER_D); }
  else { g.addColorStop(0, PAPER_D); g.addColorStop(0.15, PAPER); g.addColorStop(1, PAPER); }
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  if (open < 0.95) return;

  // handwriting lines appear
  const wp = prog(t, side === 'left' ? 4.6 : 5.4, side === 'left' ? 5.6 : 6.6);
  ctx.save();
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.55; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const left = x + 34, usable = w - 68;
  pageLines.forEach((ln, i) => {
    const lp = clamp(wp * pageLines.length - i);
    if (lp <= 0) return;
    const yy = y + 34 + i * 20;
    ctx.beginPath();
    const L = usable * ln.len * lp;
    for (let s = 0; s <= L; s += 4) {
      const wob = Math.sin((s + ln.seed) * 0.35) * 2.2 + Math.sin((s + ln.seed) * 0.11) * 1.5;
      s ? ctx.lineTo(left + s, yy + wob) : ctx.moveTo(left + s, yy + wob);
    }
    ctx.stroke();
  });
  ctx.restore();
}

// title written with an ink/gold reveal
function title(t) {
  const p = prog(t, 4.2, 7.0);
  if (p <= 0) return;
  const cy = H * 0.30;
  ctx.save();
  ctx.font = '700 150px "Cormorant Garamond", "Bitstream Charter", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const text = 'Devonbegi Kundaligi';
  const tw = ctx.measureText(text).width;
  const x0 = W / 2 - tw / 2;
  const revealX = x0 + (tw + 40) * easeInOut(p);

  // gold gradient text with moving shine
  const shine = prog(t, 7.6, 9.0);
  const g = ctx.createLinearGradient(x0, cy - 80, x0 + tw, cy + 80);
  g.addColorStop(0, GOLD_D); g.addColorStop(0.5, GOLD); g.addColorStop(1, GOLD_D);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, revealX, H); ctx.clip();
  ctx.shadowColor = 'rgba(245,190,90,.6)'; ctx.shadowBlur = 30;
  ctx.fillStyle = g; ctx.fillText(text, W / 2, cy);
  ctx.shadowBlur = 0;
  if (shine > 0 && shine < 1) {
    const sx = lerp(x0 - 300, x0 + tw + 300, easeInOut(shine));
    const sg = ctx.createLinearGradient(sx - 160, 0, sx + 160, 0);
    sg.addColorStop(0, 'rgba(255,248,220,0)'); sg.addColorStop(0.5, 'rgba(255,248,220,.95)'); sg.addColorStop(1, 'rgba(255,248,220,0)');
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = sg; ctx.fillText(text, W / 2, cy);
  }
  ctx.restore();

  // quill tip / glowing ink point at the writing edge
  if (p < 1) {
    const qx = revealX, qy = cy + Math.sin(p * 40) * 30;
    const qg = ctx.createRadialGradient(qx, qy, 0, qx, qy, 50);
    qg.addColorStop(0, 'rgba(255,240,200,1)'); qg.addColorStop(0.3, 'rgba(250,200,110,.6)'); qg.addColorStop(1, 'rgba(250,200,110,0)');
    ctx.fillStyle = qg; ctx.beginPath(); ctx.arc(qx, qy, 50, 0, Math.PI * 2); ctx.fill();
    drawQuill(qx, qy);
  }

  // ornamental divider
  const dp = easeOut(prog(t, 6.6, 7.8));
  if (dp > 0) {
    const dy = cy + 105, half = 420 * dp;
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.globalAlpha = dp;
    ctx.beginPath(); ctx.moveTo(W / 2 - half, dy); ctx.lineTo(W / 2 - 30, dy);
    ctx.moveTo(W / 2 + 30, dy); ctx.lineTo(W / 2 + half, dy); ctx.stroke();
    ctx.save(); ctx.translate(W / 2, dy); ctx.rotate(Math.PI / 4 + (1 - dp) * 2);
    ctx.fillStyle = GOLD_L; ctx.fillRect(-10, -10, 20, 20); ctx.restore();
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(W / 2 + s * half, dy, 4, 0, Math.PI * 2); ctx.fillStyle = GOLD_L; ctx.fill(); });
  }

  // subtitle
  const sp = easeOut(prog(t, 7.2, 8.4));
  if (sp > 0) {
    ctx.globalAlpha = sp;
    ctx.font = '500 40px "Cinzel", "Bitstream Charter", serif';
    ctx.fillStyle = '#f3dfb0';
    const letter = lerp(30, 12, sp);
    drawSpaced('TARIX SAHIFALARI OCHILADI', W / 2, cy + 165 + (1 - sp) * 20, letter);
  }
  ctx.restore();
}

function drawSpaced(str, cx, cy, spacing) {
  const chars = [...str];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let x = cx - total / 2;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, x, cy); x += widths[i] + spacing; });
  ctx.textAlign = 'center';
}

function drawQuill(x, y) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.7);
  const g = ctx.createLinearGradient(0, 0, 0, -190);
  g.addColorStop(0, '#fff6dc'); g.addColorStop(1, 'rgba(255,246,220,.15)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(34, -80, 14, -190);
  ctx.quadraticCurveTo(-12, -110, 0, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,30,.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, -90, 12, -185); ctx.stroke();
  ctx.restore();
}

function particles(t) {
  ctx.save();
  dust.forEach(d => {
    const y = (d.y - t * d.sp + H * 10) % H;
    const x = d.x + Math.sin(t * 0.8 + d.ph) * 20;
    const a = d.a * (0.5 + 0.5 * Math.sin(t * 2 + d.ph)) * clamp(t / 1.2);
    ctx.globalAlpha = a;
    ctx.fillStyle = GOLD_L;
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
  });
  // burst when book opens
  const bt = t - 4.0;
  if (bt > 0 && bt < 3) {
    sparks.forEach(s => {
      const lt = bt - s.delay; if (lt <= 0) return;
      const pr = clamp(lt / (2 * s.sp));
      const dd = s.d * easeOut(pr);
      ctx.globalAlpha = (1 - pr) * 0.9;
      ctx.fillStyle = '#fff1c8';
      ctx.beginPath();
      ctx.arc(W / 2 + Math.cos(s.ang) * dd, H * 0.66 + Math.sin(s.ang) * dd * 0.6 - lt * 30, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.7);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.65)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- master render ----------
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  background(t);

  // mandala: draws center, then moves behind title & fades down
  const move = easeInOut(prog(t, 2.2, 4.2));
  const mScale = lerp(1, 0.95, move) * lerp(0.85, 1, easeBack(prog(t, 0, 1.2)));
  const mY = lerp(H / 2, H * 0.30, move);
  const mAlpha = lerp(1, 0.28, move) * clamp(t / 0.3);
  mandala(t, W / 2, mY, mScale, mAlpha);

  book(t);
  particles(t);
  title(t);
  vignette();

  // fade in / out
  const fade = Math.max(1 - prog(t, 0, 0.4), prog(t, 9.6, 10));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
window.render = render;

// live loop (disabled when ?capture=1)
const capture = new URLSearchParams(location.search).has('capture');
document.fonts.ready.then(() => {
  window.__ready = true;
  if (capture) { render(0); return; }
  const start = performance.now();
  (function loop(now) { render(((now - start) / 1000) % DUR); requestAnimationFrame(loop); })(start);
});
</script>
</body>
</html>
